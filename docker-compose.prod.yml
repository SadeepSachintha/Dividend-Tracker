services:
  app:
    image: ghcr.io/sadeepsachintha/dividend-tracker/app:latest
    container_name: dividend_laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .env:/var/www/.env
      - storage_data:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - dividend_network
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: dividend_tracker
      REDIS_HOST: redis

  webserver:
    image: nginx:alpine
    container_name: dividend_webserver
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/storage
    depends_on:
      - app
    networks:
      - dividend_network

  db:
    image: mysql:8.0
    container_name: dividend_mysql
    restart: unless-stopped
    command: 
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=20
      - --key-buffer-size=8M
    environment:
      MYSQL_DATABASE: dividend_tracker
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - dividend_network
    deploy:
      resources:
        limits:
          memory: 400M

  redis:
    image: redis:alpine
    container_name: dividend_redis
    restart: unless-stopped
    networks:
      - dividend_network
    deploy:
      resources:
        limits:
          memory: 64M

  scraper:
    image: ghcr.io/sadeepsachintha/dividend-tracker/scraper:latest
    container_name: dividend_scraper
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: dividend_tracker
    networks:
      - dividend_network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  dividend_network:
    driver: bridge

volumes:
  dbdata:
  storage_data:
