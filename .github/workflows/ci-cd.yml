name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-laravel:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dividend_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, bcmath, redis, intl, zip, gd
        coverage: none
        
    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        cd laravel_app
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        
    - name: Cache Composer Dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('laravel_app/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
          
    - name: Install Composer Dependencies
      working-directory: ./laravel_app
      run: composer install --prefer-dist --no-progress
      
    - name: Copy .env
      working-directory: ./laravel_app
      run: cp .env.example .env
      
    - name: Generate Key
      working-directory: ./laravel_app
      run: php artisan key:generate
      
    - name: Update .env for testing
      working-directory: ./laravel_app
      run: |
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=dividend_testing/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h"127.0.0.1" -u"root" -p"root" --silent; do
          echo 'waiting for mysql...'
          sleep 1
        done
        
    - name: Create Database
      run: |
        mysql -h"127.0.0.1" -u"root" -p"root" -e "CREATE DATABASE IF NOT EXISTS dividend_testing;"

    - name: Run Migrations
      working-directory: ./laravel_app
      run: php artisan migrate --force --seed 2>&1 || php artisan migrate:fresh --force --seed
      
    - name: Run PHPUnit
      working-directory: ./laravel_app
      run: php artisan test

  lint-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./scraper
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint with flake8
      working-directory: ./scraper
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push:
    needs: [test-laravel, lint-python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Lowercase repo name
      id: repo_name
      run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Laravel App
      uses: docker/build-push-action@v5
      with:
        context: ./laravel_app
        push: true
        tags: ghcr.io/${{ steps.repo_name.outputs.name }}/app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Scraper
      uses: docker/build-push-action@v5
      with:
        context: ./scraper
        push: true
        tags: ghcr.io/${{ steps.repo_name.outputs.name }}/scraper:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Ubuntu VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        debug: true
        script: |
          mkdir -p /home/ubuntu/dividend-tracker
          cd /home/ubuntu/dividend-tracker
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          else
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
          git fetch
          git checkout -f main
          git pull origin main
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml down --remove-orphans || true
          docker compose -f docker-compose.prod.yml up -d
          echo "Waiting for containers to initialize..."
          sleep 10
          docker exec dividend_laravel_app php artisan migrate --force
          docker exec dividend_laravel_app php artisan optimize:clear
